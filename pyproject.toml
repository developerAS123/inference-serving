[project]
name = "inferenceservingcapstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ankit", email = "ankitsinghrajput8521@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi>=0.142.2",
    "matplotlib>=3.11.2",
    "onnxruntime>=1.30.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.13.5",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
inferenceservingcapstone = "inferenceservingcapstone:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "locust>=2.46.6",
    "onnx>=1.23.1",
    "onnxscript>=0.7.2",
]
